  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/vendedlogs/states/campusvoice-pipeline-${Stage}
      RetentionInDays: 7
      KmsKeyId:
        Fn::GetAtt:
        - DataKmsKey
        - Arn
  CampusVoiceStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name:
        Fn::Sub: campusvoice-pipeline-${Stage}
      Logging:
        Destinations:
        - CloudWatchLogsLogGroup:
            LogGroupArn:
              Fn::GetAtt:
              - StateMachineLogGroup
              - Arn
        IncludeExecutionData: false
        Level: ERROR
      DefinitionSubstitutions:
        MaskPiiFunctionArn:
          Fn::GetAtt:
          - MaskPiiFunction
          - Arn
        CleanFeedbackFunctionArn:
          Fn::GetAtt:
          - CleanFeedbackFunction
          - Arn
        StartCrawlerFunctionArn:
          Fn::GetAtt:
          - StartCrawlerFunction
          - Arn
        EmbedFeedbackFunctionArn:
          Fn::GetAtt:
          - EmbedFeedbackFunction
          - Arn
        SignManifestFunctionArn:
          Fn::GetAtt:
          - SignManifestFunction
          - Arn
      Definition:
        StartAt: MaskPII
        States:
          MaskPII:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${MaskPiiFunctionArn}
              Payload:
                bucket.$: $.bucket
                key.$: $.key
                batch_id.$: $.batch_id
            ResultSelector:
              batch_id.$: $.Payload.batch_id
              staging_path.$: $.Payload.staging_path
              record_count.$: $.Payload.record_count
              pii_count.$: $.Payload.pii_count
            ResultPath: $.mask_result
            Retry:
            - ErrorEquals:
              - States.TaskFailed
              - Lambda.ServiceException
              - Lambda.AWSLambdaException
              IntervalSeconds: 2
              MaxAttempts: 2
              BackoffRate: 2.0
            Catch:
            - ErrorEquals:
              - States.ALL
              ResultPath: $.error
              Next: PipelineFailed
            Next: CleanFeedback
          CleanFeedback:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${CleanFeedbackFunctionArn}
              Payload:
                batch_id.$: $.batch_id
                staging_path.$: $.mask_result.staging_path
                record_count.$: $.mask_result.record_count
            ResultSelector:
              batch_id.$: $.Payload.batch_id
              record_count.$: $.Payload.record_count
              curated_prefix.$: $.Payload.curated_prefix
              jsonl_path.$: $.Payload.jsonl_path
            ResultPath: $.clean_result
            Retry:
            - ErrorEquals:
              - States.TaskFailed
              - Lambda.ServiceException
              IntervalSeconds: 2
              MaxAttempts: 2
              BackoffRate: 2.0
            Catch:
            - ErrorEquals:
              - States.ALL
              ResultPath: $.error
              Next: PipelineFailed
            Next: StartCrawler
          StartCrawler:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${StartCrawlerFunctionArn}
              Payload:
                batch_id.$: $.batch_id
            ResultPath: $.crawler_result
            Retry:
            - ErrorEquals:
              - States.TaskFailed
              - Lambda.ServiceException
              IntervalSeconds: 2
              MaxAttempts: 2
              BackoffRate: 2.0
            Catch:
            - ErrorEquals:
              - States.ALL
              ResultPath: $.error
              Next: PipelineFailed
            Next: EmbedFeedback
          EmbedFeedback:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${EmbedFeedbackFunctionArn}
              Payload:
                batch_id.$: $.batch_id
                record_count.$: $.clean_result.record_count
            ResultSelector:
              batch_id.$: $.Payload.batch_id
              vector_count.$: $.Payload.vector_count
              vector_path.$: $.Payload.vector_path
            ResultPath: $.embed_result
            Retry:
            - ErrorEquals:
              - States.TaskFailed
              - Lambda.ServiceException
              IntervalSeconds: 2
              MaxAttempts: 2
              BackoffRate: 2.0
            Catch:
            - ErrorEquals:
              - States.ALL
              ResultPath: $.error
              Next: PipelineFailed
            Next: SignManifest
          SignManifest:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${SignManifestFunctionArn}
              Payload:
                batch_id.$: $.batch_id
                record_count.$: $.clean_result.record_count
            ResultPath: $.sign_result
            Retry:
            - ErrorEquals:
              - States.TaskFailed
              - Lambda.ServiceException
              IntervalSeconds: 2
              MaxAttempts: 2
              BackoffRate: 2.0
            Catch:
            - ErrorEquals:
              - States.ALL
              ResultPath: $.error
              Next: PipelineFailed
            Next: PipelineSuccess
          PipelineSuccess:
            Type: Succeed
          PipelineFailed:
            Type: Fail
            Error: PipelineExecutionFailed
            Cause: CampusVoice data pipeline encountered an unrecoverable 
              failure.
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: MaskPiiFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: CleanFeedbackFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: StartCrawlerFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: EmbedFeedbackFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: SignManifestFunction
      - Statement:
        - Effect: Allow
          Action:
          - logs:CreateLogDelivery
          - logs:CreateLogStream
          - logs:GetLogDelivery
          - logs:UpdateLogDelivery
          - logs:DeleteLogDelivery
          - logs:ListLogDeliveries
          - logs:PutLogEvents
          - logs:PutResourcePolicy
          - logs:DescribeResourcePolicies
          - logs:DescribeLogGroups
          Resource: '*'
