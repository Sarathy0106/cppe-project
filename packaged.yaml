      SecurityGroupEgress:
      - IpProtocol: -1
        CidrIp: 0.0.0.0/0
      Tags:
      - Key: Name
        Value:
          Fn::Sub: campusvoice-deny-sg-${Stage}
  GlueSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Self-referencing security group for Glue ETL workers
      VpcId:
        Ref: CampusVoiceVpc
      Tags:
      - Key: Name
        Value:
          Fn::Sub: campusvoice-glue-sg-${Stage}
  GlueSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: GlueSecurityGroup
      IpProtocol: -1
      SourceSecurityGroupId:
        Ref: GlueSecurityGroup
