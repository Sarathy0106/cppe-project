AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "CampusVoice: Secure, serverless AI and big-data student feedback platform\
  \ (Wipro CPPE). Phase 1 & Phase 3: Security Foundation, Athena/Glue Catalog Data\
  \ Lake, Step Functions Pipeline, KMS Signatures.\n"
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - prod
    Description: Deployment stage (dev, prod)
  AlertEmail:
    Type: String
    Default: sarathy01062005@gmail.com
    Description: Email address for budget and security alerts
  LlmModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Amazon Bedrock LLM model ID or inference profile ARN
  EmbedModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Amazon Bedrock Titan embeddings model ID
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON
Resources:
  DataKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CampusVoice symmetric CMK for S3, CloudWatch Logs, and Athena
        encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Id: campusvoice-data-key-policy
        Statement:
        - Sid: EnableRootAndAdminAccess
          Effect: Allow
          Principal:
            AWS:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
          Action: kms:*
          Resource: '*'
        - Sid: AllowCloudTrailEncryption
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action:
          - kms:GenerateDataKey*
          - kms:DescribeKey
          Resource: '*'
          Condition:
            StringLike:
              kms:EncryptionContext:aws:cloudtrail:arn:
                Fn::Sub: 
                  arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/*
        - Sid: AllowCloudWatchLogsEncryption
          Effect: Allow
          Principal:
            Service:
              Fn::Sub: logs.${AWS::Region}.amazonaws.com
          Action:
          - kms:Encrypt*
          - kms:Decrypt*
          - kms:ReEncrypt*
          - kms:GenerateDataKey*
          - kms:Describe*
          Resource: '*'
          Condition:
            ArnLike:
              kms:EncryptionContext:aws:logs:arn:
                Fn::Sub: 
                  arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
        - Sid: AllowSNSEncryption
          Effect: Allow
          Principal:
            Service: sns.amazonaws.com
          Action:
          - kms:GenerateDataKey*
          - kms:Decrypt*
          Resource: '*'
        - Sid: AllowS3ServiceEncryption
          Effect: Allow
          Principal:
            Service: s3.amazonaws.com
          Action:
          - kms:GenerateDataKey*
          - kms:Decrypt*
          Resource: '*'
  DataKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/campusvoice-data
      TargetKeyId:
        Ref: DataKmsKey
  SignKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CampusVoice asymmetric key for batch manifest digital 
        signatures
      KeySpec: RSA_2048
      KeyUsage: SIGN_VERIFY
      KeyPolicy:
        Version: '2012-10-17'
        Id: campusvoice-sign-key-policy
        Statement:
        - Sid: EnableRootAccess
          Effect: Allow
          Principal:
            AWS:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
          Action: kms:*
          Resource: '*'
  SignKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/campusvoice-sign
      TargetKeyId:
        Ref: SignKmsKey
  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: campusvoice-raw-${AWS::AccountId}-${Stage}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: aws:kms
            KMSMasterKeyID:
              Fn::GetAtt:
              - DataKmsKey
              - Arn
          BucketKeyEnabled: true
      NotificationConfiguration:
        LambdaConfigurations:
        - Event: s3:ObjectCreated:*
          Function:
            Fn::GetAtt:
            - StartPipelineFunction
            - Arn
          Filter:
            S3Key:
              Rules:
              - Name: prefix
                Value: uploads/
              - Name: suffix
                Value: .csv
  RawBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: RawBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: DenyNonHttpsTraffic
          Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:s3:::${RawBucket}
          - Fn::Sub: arn:${AWS::Partition}:s3:::${RawBucket}/*
          Condition:
            Bool:
              aws:SecureTransport: 'false'
        - Sid: DenyNonKmsPutObject
          Effect: Deny
          Principal: '*'
          Action: s3:PutObject
          Resource:
            Fn::Sub: arn:${AWS::Partition}:s3:::${RawBucket}/*
          Condition:
            StringNotEquals:
              s3:x-amz-server-side-encryption: aws:kms
            'Null':
              s3:x-amz-server-side-encryption: 'false'
  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: campusvoice-processed-${AWS::AccountId}-${Stage}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: aws:kms
            KMSMasterKeyID:
              Fn::GetAtt:
              - DataKmsKey
              - Arn
          BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
        - Id: AthenaResultsRetention7Days
          Prefix: athena-results/
          Status: Enabled
          ExpirationInDays: 7
  ProcessedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: ProcessedBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: DenyNonHttpsTraffic
          Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:s3:::${ProcessedBucket}
          - Fn::Sub: arn:${AWS::Partition}:s3:::${ProcessedBucket}/*
          Condition:
            Bool:
              aws:SecureTransport: 'false'
        - Sid: DenyNonKmsPutObject
          Effect: Deny
          Principal: '*'
          Action: s3:PutObject
          Resource:
            Fn::Sub: arn:${AWS::Partition}:s3:::${ProcessedBucket}/*
          Condition:
            StringNotEquals:
              s3:x-amz-server-side-encryption: aws:kms
            'Null':
              s3:x-amz-server-side-encryption: 'false'
  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: campusvoice-logs-${AWS::AccountId}-${Stage}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: aws:kms
            KMSMasterKeyID:
              Fn::GetAtt:
              - DataKmsKey
              - Arn
          BucketKeyEnabled: true
  LogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: LogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: DenyNonHttpsTraffic
          Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:s3:::${LogsBucket}
          - Fn::Sub: arn:${AWS::Partition}:s3:::${LogsBucket}/*
          Condition:
            Bool:
              aws:SecureTransport: 'false'
        - Sid: AllowCloudTrailAclCheck
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action: s3:GetBucketAcl
          Resource:
            Fn::Sub: arn:${AWS::Partition}:s3:::${LogsBucket}
        - Sid: AllowCloudTrailWriteLogs
          Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action: s3:PutObject
          Resource:
            Fn::Sub: 
              arn:${AWS::Partition}:s3:::${LogsBucket}/cloudtrail/AWSLogs/${AWS::AccountId}/*
          Condition:
            StringEquals:
              s3:x-amz-acl: bucket-owner-full-control
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: campusvoice-frontend-${AWS::AccountId}-${Stage}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: DenyNonHttpsTraffic
          Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:s3:::${FrontendBucket}
          - Fn::Sub: arn:${AWS::Partition}:s3:::${FrontendBucket}/*
          Condition:
            Bool:
              aws:SecureTransport: 'false'
  CloudTrailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/cloudtrail/campusvoice-${Stage}
      RetentionInDays: 7
      KmsKeyId:
        Fn::GetAtt:
        - DataKmsKey
        - Arn
  CloudTrailLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudtrail.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: CloudTrailToCloudWatchLogs
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: ${CloudTrailLogGroup.Arn}:*
  CampusVoiceTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn:
    - LogsBucketPolicy
    Properties:
      TrailName:
        Fn::Sub: campusvoice-trail-${Stage}
      S3BucketName:
        Ref: LogsBucket
      S3KeyPrefix: cloudtrail
      IsLogging: true
      EnableLogFileValidation: true
      IncludeGlobalServiceEvents: true
      CloudWatchLogsLogGroupArn:
        Fn::GetAtt:
        - CloudTrailLogGroup
        - Arn
      CloudWatchLogsRoleArn:
        Fn::GetAtt:
        - CloudTrailLogsRole
        - Arn
      KMSKeyId:
        Fn::GetAtt:
        - DataKmsKey
        - Arn
      EventSelectors:
      - ReadWriteType: All
        IncludeManagementEvents: true
        DataResources:
        - Type: AWS::S3::Object
          Values:
          - Fn::Sub: ${RawBucket.Arn}/
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: campusvoice-alerts-${Stage}
      KmsMasterKeyId:
        Fn::GetAtt:
        - DataKmsKey
        - Arn
  AlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        Ref: AlertsTopic
      Protocol: email
      Endpoint:
        Ref: AlertEmail
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName:
          Fn::Sub: campusvoice-budget-${Stage}
        BudgetLimit:
          Amount: 10
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
      - Notification:
          ComparisonOperator: GREATER_THAN
          NotificationType: ACTUAL
          Threshold: 80
          ThresholdType: PERCENTAGE
        Subscribers:
        - SubscriptionType: EMAIL
          Address:
            Ref: AlertEmail
  AccessDeniedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName:
        Ref: CloudTrailLogGroup
      FilterPattern: '{ ($.errorCode = "*UnauthorizedOperation") || ($.errorCode =
        "AccessDenied*") }'
      MetricTransformations:
      - MetricValue: '1'
        MetricNamespace: CampusVoice/Security
        MetricName: AccessDeniedCount
        DefaultValue: 0
  AccessDeniedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: campusvoice-access-denied-${Stage}
      AlarmDescription: Fires when >= 3 unauthorized or access denied operations
        occur within 5 minutes
      MetricName: AccessDeniedCount
      Namespace: CampusVoice/Security
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
      - Ref: AlertsTopic
      TreatMissingData: notBreaching
  PipelineFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: campusvoice-pipeline-failure-${Stage}
      AlarmDescription: Fires when the Step Functions feedback processing 
        pipeline fails
      MetricName: ExecutionsFailed
      Namespace: AWS/States
      Dimensions:
      - Name: StateMachineArn
        Value:
          Ref: CampusVoiceStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
      - Ref: AlertsTopic
      TreatMissingData: notBreaching
  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: campusvoice-lambda-errors-${Stage}
      AlarmDescription: Fires when any pipeline Lambda function incurs unhandled
        errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: MaskPiiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
      - Ref: AlertsTopic
      TreatMissingData: notBreaching
  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName:
        Fn::Sub: campusvoice-ops-${Stage}
      DashboardBody:
        Fn::Sub: "{\n  \"widgets\": [\n    {\n      \"type\": \"metric\",\n      \"\
          x\": 0,\n      \"y\": 0,\n      \"width\": 12,\n      \"height\": 6,\n \
          \     \"properties\": {\n        \"metrics\": [\n          [ \"CampusVoice/Security\"\
          , \"AccessDeniedCount\", { \"stat\": \"Sum\", \"label\": \"Access Denied\
          \ / Unauthorized Events\", \"color\": \"#d62728\" } ]\n        ],\n    \
          \    \"view\": \"timeSeries\",\n        \"stacked\": false,\n        \"\
          region\": \"${AWS::Region}\",\n        \"title\": \"Threat Detection: Unauthorized\
          \ & Access Denied Operations\",\n        \"period\": 300\n      }\n    },\n\
          \    {\n      \"type\": \"metric\",\n      \"x\": 12,\n      \"y\": 0,\n\
          \      \"width\": 12,\n      \"height\": 6,\n      \"properties\": {\n \
          \       \"metrics\": [\n          [ \"AWS/States\", \"ExecutionsSucceeded\"\
          , \"StateMachineArn\", \"${CampusVoiceStateMachine}\", { \"stat\": \"Sum\"\
          , \"color\": \"#2ca02c\" } ],\n          [ \"AWS/States\", \"ExecutionsFailed\"\
          , \"StateMachineArn\", \"${CampusVoiceStateMachine}\", { \"stat\": \"Sum\"\
          , \"color\": \"#d62728\" } ],\n          [ \"AWS/States\", \"ExecutionsStarted\"\
          , \"StateMachineArn\", \"${CampusVoiceStateMachine}\", { \"stat\": \"Sum\"\
          , \"color\": \"#1f77b4\" } ]\n        ],\n        \"view\": \"timeSeries\"\
          ,\n        \"stacked\": false,\n        \"region\": \"${AWS::Region}\",\n\
          \        \"title\": \"Step Functions Pipeline Orchestration\",\n       \
          \ \"period\": 300\n      }\n    },\n    {\n      \"type\": \"metric\",\n\
          \      \"x\": 0,\n      \"y\": 6,\n      \"width\": 12,\n      \"height\"\
          : 6,\n      \"properties\": {\n        \"metrics\": [\n          [ \"AWS/Lambda\"\
          , \"Invocations\", \"FunctionName\", \"${MaskPiiFunction}\", { \"stat\"\
          : \"Sum\" } ],\n          [ \"AWS/Lambda\", \"Invocations\", \"FunctionName\"\
          , \"${CleanFeedbackFunction}\", { \"stat\": \"Sum\" } ],\n          [ \"\
          AWS/Lambda\", \"Invocations\", \"FunctionName\", \"${EmbedFeedbackFunction}\"\
          , { \"stat\": \"Sum\" } ],\n          [ \"AWS/Lambda\", \"Errors\", \"FunctionName\"\
          , \"${MaskPiiFunction}\", { \"stat\": \"Sum\", \"color\": \"#d62728\" }\
          \ ]\n        ],\n        \"view\": \"timeSeries\",\n        \"stacked\"\
          : false,\n        \"region\": \"${AWS::Region}\",\n        \"title\": \"\
          Lambda Pipeline Functions Invocations & Errors\",\n        \"period\": 300\n\
          \      }\n    },\n    {\n      \"type\": \"metric\",\n      \"x\": 12,\n\
          \      \"y\": 6,\n      \"width\": 12,\n      \"height\": 6,\n      \"properties\"\
          : {\n        \"metrics\": [\n          [ \"AWS/ApiGateway\", \"4xx\", \"\
          ApiId\", \"${CampusVoiceHttpApi}\", { \"stat\": \"Sum\", \"color\": \"#ff7f0e\"\
          \ } ],\n          [ \"AWS/ApiGateway\", \"5xx\", \"ApiId\", \"${CampusVoiceHttpApi}\"\
          , { \"stat\": \"Sum\", \"color\": \"#d62728\" } ],\n          [ \"AWS/ApiGateway\"\
          , \"Count\", \"ApiId\", \"${CampusVoiceHttpApi}\", { \"stat\": \"Sum\",\
          \ \"color\": \"#1f77b4\" } ]\n        ],\n        \"view\": \"timeSeries\"\
          ,\n        \"stacked\": false,\n        \"region\": \"${AWS::Region}\",\n\
          \        \"title\": \"HTTP API Gateway Traffic (Total, 4XX & 5XX)\",\n \
          \       \"period\": 300\n      }\n    }\n  ]\n}\n"
  CampusVoiceDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId:
        Ref: AWS::AccountId
      DatabaseInput:
        Name:
          Fn::Sub: campusvoice_db_${Stage}
        Description: CampusVoice Curated Feedback Catalog Database
  FeedbackParquetTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId:
        Ref: AWS::AccountId
      DatabaseName:
        Ref: CampusVoiceDatabase
      TableInput:
        Name: feedback
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
        StorageDescriptor:
          Columns:
          - Name: feedback_id
            Type: string
          - Name: department
            Type: string
          - Name: year
            Type: int
          - Name: feedback_text
            Type: string
          - Name: feedback_date
            Type: string
          - Name: sentiment
            Type: string
          - Name: category
            Type: string
          - Name: category_confidence
            Type: double
          - Name: pii_count
            Type: int
          - Name: batch_id
            Type: string
          Location:
            Fn::Sub: s3://${ProcessedBucket}/curated/
          InputFormat: 
            org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: 
            org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: 
              org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
        PartitionKeys:
        - Name: month
          Type: string
  AnalyticsWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name:
        Fn::Sub: campusvoice-analytics-${Stage}
      Description: CampusVoice Analytics Workgroup with 100MB query scan cap
      State: ENABLED
      WorkGroupConfiguration:
        BytesScannedCutoffPerQuery: 104857600
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation:
            Fn::Sub: s3://${ProcessedBucket}/athena-results/
          EncryptionConfiguration:
            EncryptionOption: SSE_KMS
            KmsKey:
              Fn::GetAtt:
              - DataKmsKey
              - Arn
  StartPipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: campusvoice-start-pipeline-${Stage}
      CodeUri: 
        s3://aws-sam-cli-managed-default-samclisourcebucket-nx6o74yglnwl/campusvoice/049d7e751102573ba4009145863de026
      Handler: app.lambda_handler
      Environment:
        Variables:
          STATE_MACHINE_ARN:
            Ref: CampusVoiceStateMachine
      Policies:
      - StepFunctionsExecutionPolicy:
          StateMachineName:
            Fn::Sub: campusvoice-pipeline-${Stage}
  StartPipelinePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::GetAtt:
        - StartPipelineFunction
        - Arn
      Principal: s3.amazonaws.com
      SourceArn:
        Fn::Sub: 
          arn:${AWS::Partition}:s3:::campusvoice-raw-${AWS::AccountId}-${Stage}
  MaskPiiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: campusvoice-mask-pii-${Stage}
      CodeUri: 
        s3://aws-sam-cli-managed-default-samclisourcebucket-nx6o74yglnwl/campusvoice/6f8cbd576b984080265cddbfb6ffdd4e
      Handler: app.lambda_handler
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          PROCESSED_BUCKET:
            Ref: ProcessedBucket
          KMS_KEY_ID:
            Fn::GetAtt:
            - DataKmsKey
            - Arn
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - s3:GetObject
          Resource:
            Fn::Sub: 
              arn:${AWS::Partition}:s3:::campusvoice-raw-${AWS::AccountId}-${Stage}/*
        - Effect: Allow
          Action:
          - s3:PutObject
          Resource:
            Fn::Sub: arn:${AWS::Partition}:s3:::${ProcessedBucket}/*
        - Effect: Allow
          Action:
          - comprehend:DetectPiiEntities
          - comprehend:BatchDetectSentiment
          Resource: '*'
        - Effect: Allow
          Action:
          - kms:Decrypt
          - kms:GenerateDataKey*
          Resource:
            Fn::GetAtt:
            - DataKmsKey
            - Arn
  CleanFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: campusvoice-clean-feedback-${Stage}
      CodeUri: 
        s3://aws-sam-cli-managed-default-samclisourcebucket-nx6o74yglnwl/campusvoice/deacbb2bcd377ca45a12d31381bbd8b2
      Handler: app.lambda_handler
      Timeout: 180
      MemorySize: 512
      Environment:
        Variables:
          PROCESSED_BUCKET:
            Ref: ProcessedBucket
          DATABASE_NAME:
            Ref: CampusVoiceDatabase
          KMS_KEY_ID:
            Fn::GetAtt:
            - DataKmsKey
            - Arn
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - s3:GetObject
          - s3:PutObject
          - s3:GetBucketLocation
          - s3:ListBucket
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:s3:::${ProcessedBucket}
          - Fn::Sub: arn:${AWS::Partition}:s3:::${ProcessedBucket}/*
        - Effect: Allow
          Action:
          - athena:StartQueryExecution
          - athena:GetQueryExecution
          - athena:GetQueryResults
          Resource: '*'
        - Effect: Allow
          Action:
          - glue:GetDatabase
          - glue:GetTable
          - glue:GetPartitions
          - glue:GetPartition
          - glue:BatchCreatePartition
          - glue:CreatePartition
          Resource: '*'
        - Effect: Allow
          Action:
          - kms:Decrypt
          - kms:GenerateDataKey*
          Resource:
            Fn::GetAtt:
            - DataKmsKey
            - Arn
  StartCrawlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: campusvoice-start-crawler-${Stage}
      CodeUri: 
        s3://aws-sam-cli-managed-default-samclisourcebucket-nx6o74yglnwl/campusvoice/ffe2ff1188da4185ea553210c76b4457
      Handler: app.lambda_handler
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          PROCESSED_BUCKET:
            Ref: ProcessedBucket
          DATABASE_NAME:
            Ref: CampusVoiceDatabase
          KMS_KEY_ID:
            Fn::GetAtt:
            - DataKmsKey
            - Arn
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - athena:StartQueryExecution
          - athena:GetQueryExecution
          - athena:GetQueryResults
          Resource: '*'
        - Effect: Allow
          Action:
          - s3:GetObject
          - s3:PutObject
          - s3:GetBucketLocation
          - s3:ListBucket
          Resource:
